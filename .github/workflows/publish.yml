name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A7E989: ${{ secrets.A7E989 }}
          B60036: ${{ secrets.B60036 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A7E989', '')
          k2 = os.environ.get('B60036', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- f99a299152de5695f840237a909eff02f143 -->', k1) if k1 else txt
          out = out.replace('<!-- 2d93e95655aa346ae3bc9485cdcfaa5d8249e5e1 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
